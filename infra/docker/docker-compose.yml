version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-toolsite-postgres
    environment:
      POSTGRES_DB: ai_toolsite
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-toolsite-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: ai-toolsite-api
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://dev:dev123@postgres:5432/ai_toolsite
      REDIS_HOST: redis
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api/src:/app/src

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: ai-toolsite-web
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: ai-toolsite-worker
    environment:
      DATABASE_URL: postgresql://dev:dev123@postgres:5432/ai_toolsite
      REDIS_HOST: redis
      NODE_ENV: development
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
  redisdata:
